name: Project Governance
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project governance
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python .github/scripts/project_policy_check.py --base "$GOVERNANCE_BASE_SHA"
